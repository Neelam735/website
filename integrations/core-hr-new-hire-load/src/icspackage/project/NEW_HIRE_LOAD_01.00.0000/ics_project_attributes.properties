# Integration project attributes.
#
# Environment-specific values are integration properties, set in the OIC
# console (Integration -> Actions -> Update Property Values) rather than here,
# so moving between environments does not mean rebuilding the archive.

project.code=NEW_HIRE_LOAD
project.version=01.00.0000
project.name=Core HR - New Hire Load (HDL)
project.pattern=SCHEDULED_ORCHESTRATION
project.status=CONFIGURED

# Defaults for the schedule parameters declared in the trigger WSDL.
param.inboundDirectory=/hcm/newhire/in
param.archiveDirectory=/hcm/newhire/archive
param.rejectDirectory=/hcm/newhire/reject
param.filePattern=NEWHIRE_*.csv
# Must exist in HCM under Manage Common Lookups -> HRC_SOURCE_SYSTEM_OWNER.
param.sourceSystemOwner=OIC_NEWHIRE
param.environmentName=DEV
param.notifyTo=hcm-integrations@example.com
param.batchSize=500
param.pollIntervalSeconds=60
# 60 x 60s = one hour before the run reports TIMED_OUT.
param.maxPollAttempts=60
# IMPORT_ONLY stages the data set in HCM for inspection without committing to
# Core HR. Use it for the first run in any new environment.
param.importMode=IMPORT_AND_LOAD
