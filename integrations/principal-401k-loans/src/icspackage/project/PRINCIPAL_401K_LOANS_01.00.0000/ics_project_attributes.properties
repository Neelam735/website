# Integration project attributes.
#
# Environment-specific values are integration properties, set in the OIC
# console (Integration -> Actions -> Update Property Values) rather than here,
# so moving between environments does not mean rebuilding the archive.
#
# Anything that is a *data* mapping rather than an environment setting belongs
# in a lookup instead; see icspackage/lookups/.

project.code=PRINCIPAL_401K_LOANS
project.version=01.00.0000
project.name=Principal 401(k) Loans - Outbound File
project.pattern=SCHEDULED_ORCHESTRATION
project.status=CONFIGURED

# Defaults for the schedule parameters declared in the trigger WSDL.

# --- Extract submission ---------------------------------------------------
# Name of the HCM Extract definition, exactly as it appears in Data Exchange.
param.extractName=Principal 401K Loans Outbound
# Blank means "the day the run starts". Set explicitly (YYYY-MM-DD) to rerun
# an earlier period without waiting for the schedule.
param.runDate=
# N for a normal run. Y skips submission and reuses the last successful
# extract output for runDate - see docs/runbook.md before setting it.
param.reprocessFlag=N
# Payroll the loan repayments were taken in. Scopes the extract's payroll
# period parameter.
param.payrollName=US Semi-Monthly Payroll
# Comma-separated legal employer names, or blank for every employer mapped in
# the PFG_401K_CONTRACT lookup.
param.legalEmployerName=
# Y sends only loans whose repayment changed since the last run. The trailer
# still reconciles against whatever is in the file.
param.changesOnly=N

# --- ESS polling ----------------------------------------------------------
param.pollIntervalSeconds=30
# Exponential backoff, capped. 30s -> 60 -> 120 -> 240 -> 300 -> 300 ...
param.pollBackoffFactor=2
param.pollMaxIntervalSeconds=300
# 40 attempts under the backoff above is a little over three hours.
param.maxPollAttempts=40

# --- UCM ------------------------------------------------------------------
param.ucmAccount=hcm$/dataloader$/export$
# Extract delivery writes the output under this title prefix; step 60 searches
# UCM for it rather than trusting a document id to be stable.
param.ucmTitlePrefix=PFG_401K_LOANS
param.ucmArchiveAccount=hcm$/dataloader$/export$

# --- Principal delivery ---------------------------------------------------
param.remoteDirectory=/inbound/401k/loans
# Written first as <name>.tmp, renamed on success. Principal's poller only
# picks up the final name, so a half-written file is never collected.
param.tempSuffix=.tmp
# Set to Y only if Principal's profile asks for a zero-byte trigger file.
param.triggerFileEnabled=N
param.triggerFileSuffix=.done
param.archiveDirectory=/outbound/401k/archive
param.pgpEncryptionEnabled=Y
# Alias of Principal's public key in the OIC certificate store.
param.pgpPublicKeyAlias=PRINCIPAL_PGP_PUBLIC
param.pgpArmored=N

# --- File content ---------------------------------------------------------
# T marks the file as a test transmission in the header; P is production.
# Keep this T in every environment except PROD.
param.testProductionFlag=T
param.senderId=ACMECORP
param.fileVersion=001
# SEND_EMPTY writes a header and trailer with zero detail rows so Principal
# can distinguish "nothing to report" from "the feed broke".
# SKIP_SEND delivers nothing. Principal's onboarding profile decides which.
param.zeroRecordPolicy=SEND_EMPTY
# FULL exposes the national identifier, which Principal requires to match a
# participant. MASKED sends the last four digits only and is for non-production
# environments; Principal will reject a MASKED production file.
param.ssnPolicy=FULL

# --- Operations -----------------------------------------------------------
param.environmentName=DEV
param.notifyTo=hcm-integrations@example.com
# Business faults also copy the benefits team; they, not IT, own the data.
param.notifyBusinessTo=benefits-ops@example.com
